services:
  - type: web
    name: kintai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: "7777"
      - key: ADMIN_RESET_CODE
        value: RESET-KINTAI-2026
      - key: KINTAI_STRICT_SUBMIT
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
