<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>勤怠システム</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
  <main class="stage">
    <!-- E-01 ホーム／打刻 -->
    <section id="e01" class="screen is-visible" aria-label="ホーム／打刻">
      <div class="phone">
        <div class="app-header">
          <h1>勤怠システム（社員）</h1>
          <div class="header-links">
            <button type="button" class="linkish" data-goto="e02">月次一覧</button>
            <button type="button" class="linkish" data-action="submit">提出</button>
            <button type="button" class="linkish" data-goto="a01">管理者</button>
          </div>
        </div>

        <div class="card">
          <label class="field-label" for="emp-id">社員番号</label>
          <div class="row">
            <input id="emp-id" class="input" type="text" maxlength="4" inputmode="numeric" value="1001" />
            <button type="button" class="btn btn-secondary" id="btn-emp-confirm">確認</button>
          </div>
          <p class="identity" id="e01-identity">氏名：—　番号：—</p>
        </div>

        <div class="card">
          <h2 class="card-title" id="e01-today-title">本日</h2>
          <div class="punch-grid punch-grid-pair">
            <div class="punch-slot">
              <button type="button" id="btn-work" class="btn btn-punch btn-in" data-action="work">出勤</button>
            </div>
            <div class="punch-slot">
              <button type="button" id="btn-break" class="btn btn-punch btn-break" data-action="break" disabled>休憩開始</button>
            </div>
          </div>
        </div>

        <div id="alert-missing" class="alert alert-warn is-hidden">⚠ 未入力：退勤未</div>
        <div id="alert-break" class="alert alert-danger is-hidden">⚠ 休憩不足：必要60分／実績40分／不足20分</div>
      </div>
    </section>

    <!-- E-02 月次一覧 -->
    <section id="e02" class="screen" aria-label="月次一覧">
      <div class="phone phone-wide">
        <div class="app-header">
          <h1 id="e02-title">月次一覧</h1>
          <div class="header-links">
            <button type="button" class="btn btn-tiny" id="e02-prev">前月</button>
            <button type="button" class="btn btn-tiny" id="e02-next">翌月</button>
          </div>
        </div>
        <div class="meta-row">
          <p class="meta">ステータス：<span class="badge" id="e02-status">未提出</span></p>
          <button type="button" class="linkish" data-goto="e01">打刻</button>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>日</th><th>出勤</th><th>退勤</th><th>休憩</th><th>残業</th><th>状態</th></tr>
            </thead>
            <tbody id="e02-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- A-01 ダッシュボード -->
    <section id="a01" class="screen" aria-label="ダッシュボード">
      <div class="phone phone-wide">
        <div class="app-header">
          <h1>管理者ダッシュボード</h1>
        </div>
        <div class="month-row">
          <label class="field-label" for="a01-month">対象月</label>
          <select id="a01-month" class="input month-select" aria-label="対象月"></select>
        </div>
        <div class="kpi-grid">
          <div class="kpi"><span class="kpi-label">未提出</span><span class="kpi-value" id="kpi-unsubmitted">—</span></div>
          <div class="kpi"><span class="kpi-label">承認待ち</span><span class="kpi-value" id="kpi-pending">—</span></div>
          <div class="kpi"><span class="kpi-label">要確認</span><span class="kpi-value" id="kpi-review">—</span></div>
          <div class="kpi kpi-alert"><span class="kpi-label">休憩不足</span><span class="kpi-value" id="kpi-break">—</span></div>
        </div>
        <div class="action-row action-row-full">
          <button type="button" class="btn btn-secondary" data-goto="a05">社員管理</button>
          <button type="button" class="btn btn-secondary" data-goto="a04">変更履歴</button>
          <button type="button" class="btn btn-secondary" id="btn-csv">CSV出力</button>
        </div>
      </div>
    </section>

    <!-- A-03 勤怠詳細（月次） -->
    <section id="a03" class="screen" aria-label="勤怠詳細">
      <div class="phone phone-wide a03-sheet">
        <div class="app-header a03-top">
          <h1>勤怠詳細</h1>
          <button type="button" class="linkish a03-back" data-goto="a05">社員管理</button>
        </div>

        <div class="a03-meta-row">
          <span class="a03-month" id="a03-month">—</span>
          <span class="a03-employee" id="a03-employee">—</span>
          <span class="badge badge-ok" id="a03-badge">—</span>
        </div>

        <div class="a03-summary">
          <div class="a03-summary-item">
            <span class="a03-summary-label">総労働時間</span>
            <span class="a03-summary-value" id="a03-work">—<span class="a03-unit">h</span></span>
          </div>
          <div class="a03-summary-item">
            <span class="a03-summary-label">残業時間</span>
            <span class="a03-summary-value" id="a03-ot">—<span class="a03-unit">h</span></span>
          </div>
        </div>

        <div class="a03-table-wrap">
          <table class="a03-table">
            <thead>
              <tr>
                <th>日付</th>
                <th>曜日</th>
                <th>出勤</th>
                <th>退勤</th>
                <th>休憩</th>
                <th>状態</th>
              </tr>
            </thead>
            <tbody id="a03-body"></tbody>
          </table>
        </div>

        <div class="a03-actions-block">
          <label class="field-label" for="a03-reason">差戻し／修正の理由</label>
          <input id="a03-reason" class="input" type="text" placeholder="理由を入力（差戻し・修正時は必須）" />
          <div class="action-row action-row-full a03-actions">
            <button type="button" class="btn btn-ok" data-action="a03-approve">承認</button>
            <button type="button" class="btn btn-warn" data-action="a03-reject">差戻し</button>
            <button type="button" class="btn btn-secondary" data-action="a03-save">修正して保存</button>
          </div>
        </div>
      </div>
    </section>

    <!-- A-04 変更履歴 -->
    <section id="a04" class="screen" aria-label="変更履歴">
      <div class="phone phone-wide a04-sheet">
        <div class="app-header a04-toolbar">
          <h1>全体の変更履歴</h1>
          <button type="button" class="linkish" data-goto="a01">ダッシュボード</button>
        </div>

        <div class="a04-search-row">
          <input id="a04-date" class="input" type="search" placeholder="日時" />
          <input id="a04-emp" class="input" type="search" placeholder="社員" />
          <input id="a04-changer" class="input" type="search" placeholder="変更者" />
        </div>

        <div class="a04-table-wrap">
          <table class="a04-table">
            <thead>
              <tr>
                <th>日付</th>
                <th>変更者</th>
                <th>対象従業員</th>
                <th>変更項目</th>
                <th>旧データ</th>
                <th>新データ</th>
                <th>理由／ステータス</th>
              </tr>
            </thead>
            <tbody id="a04-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- A-05 社員管理（機能用・見た目は同じ部品） -->
    <section id="a05" class="screen" aria-label="社員管理">
      <div class="phone phone-wide">
        <div class="app-header">
          <h1>社員管理</h1>
          <button type="button" class="linkish" data-goto="a01">ダッシュボード</button>
        </div>
        <div class="card">
          <label class="field-label" for="new-emp-no">新入社員の追加</label>
          <div class="row">
            <input id="new-emp-no" class="input" type="text" maxlength="4" placeholder="社員番号" />
            <input id="new-emp-name" class="input" type="text" placeholder="氏名" />
            <button type="button" class="btn btn-primary" id="btn-add-emp">追加</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>社員番号</th><th>氏名</th><th>状態</th><th>操作</th></tr></thead>
            <tbody id="a05-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- 提出チェック用ポップアップ（旧E-03） -->
  <div id="submit-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="submit-modal-title">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-panel">
      <h2 id="submit-modal-title" class="card-title">提出前チェック</h2>
      <ul class="checklist" id="submit-checklist"></ul>
      <p class="meta" id="submit-status-line">現在ステータス：未提出</p>
      <p class="hint" id="submit-hint"></p>
      <div class="action-row modal-actions">
        <button type="button" class="btn btn-secondary" data-action="close-modal">閉じる</button>
        <button type="button" class="btn btn-primary" id="btn-do-submit" disabled>提出する</button>
      </div>
    </div>
  </div>

  <!-- 管理者ログイン（mockup同系のモーダル） -->
  <div id="admin-modal" class="modal is-hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-action="close-admin-modal"></div>
    <div class="modal-panel">
      <h2 class="card-title">管理者ログイン</h2>
      <label class="field-label" for="login-admin-pass">パスワード</label>
      <input id="login-admin-pass" class="input mb" type="password" placeholder="パスワード" />
      <details class="mb">
        <summary class="hint">パスワードを忘れた</summary>
        <label class="field-label" for="reset-code">リセットコード</label>
        <input id="reset-code" class="input mb" type="text" />
        <label class="field-label" for="reset-new">新しいパスワード</label>
        <input id="reset-new" class="input mb" type="password" />
        <button type="button" class="btn btn-warn mb" id="btn-reset">リセットする</button>
      </details>
      <div class="action-row modal-actions">
        <button type="button" class="btn btn-secondary" data-action="close-admin-modal">閉じる</button>
        <button type="button" class="btn btn-primary" id="btn-admin-login">入る</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
